  <style>
    .photos-page-section {
      padding: 36px 0 80px;
      background-color: var(--color-bg-white);
    }

    .photos-page-heading {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 800;
      color: var(--color-navy);
      margin-bottom: 28px;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .pure-photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .pure-photo-item {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background-color: #0b1528;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(11, 21, 40, 0.06);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pure-photo-item:hover {
      transform: translateY(-5px) scale(1.015);
      box-shadow: 0 16px 32px rgba(11, 21, 40, 0.16);
    }

    .pure-photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pure-photo-item:hover img {
      transform: scale(1.06);
    }

    /* Minimal Pure Lightbox */
    .pure-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(7, 14, 27, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pure-lightbox.active {
      display: flex;
    }

    .pure-lightbox-stage {
      max-width: 1100px;
      max-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .pure-lightbox-stage img {
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    .pure-lb-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      z-index: 10;
    }

    .pure-lb-btn:hover {
      background: var(--color-gold);
      color: var(--color-navy);
      transform: scale(1.08);
    }

    .pure-lb-close {
      top: 20px;
      right: 20px;
    }

    .pure-lb-prev {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .pure-lb-prev:hover {
      transform: translateY(-50%) scale(1.08);
    }

    .pure-lb-next {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .pure-lb-next:hover {
      transform: translateY(-50%) scale(1.08);
    }

    @media (max-width: 768px) {
      .pure-photo-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .pure-lb-btn {
        width: 40px;
        height: 40px;
      }

      .pure-lb-prev {
        left: 10px;
      }

      .pure-lb-next {
        right: 10px;
      }
    }

    @media (max-width: 480px) {
      .pure-photo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = Array.from(document.querySelectorAll('.pure-photo-item'));
      const lightbox = document.getElementById('pureLightbox');
      const lbImg = document.getElementById('pureLbImg');
      const closeBtn = document.getElementById('pureLbClose');
      const prevBtn = document.getElementById('pureLbPrev');
      const nextBtn = document.getElementById('pureLbNext');

      const images = items.map(el => el.querySelector('img').src);
      let currentIndex = 0;

      function showImage(index) {
        if (index < 0) index = images.length - 1;
        if (index >= images.length) index = 0;
        currentIndex = index;
        lbImg.src = images[currentIndex];
      }

      function openLightbox(index) {
        showImage(index);
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }

      items.forEach((item, idx) => {
        item.addEventListener('click', () => openLightbox(idx));
      });

      closeBtn.addEventListener('click', closeLightbox);
      prevBtn.addEventListener('click', () => showImage(currentIndex - 1));
      nextBtn.addEventListener('click', () => showImage(currentIndex + 1));

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
        if (e.key === 'ArrowRight') showImage(currentIndex + 1);
      });
    });
  </script>
